# MPLADSentinel backend configuration.
# All environment-specific and sensitive values are supplied via environment
# variables (see .env.example at the repository root). The defaults below are
# safe for local development only.

spring:
  application:
    name: mpladsentinel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Local dev default targets the docker-compose Postgres, which publishes on
    # host port 5544 (see docker-compose.yml). Override with MPLADS_DB_URL.
    url: ${MPLADS_DB_URL:jdbc:postgresql://localhost:5544/mpladsentinel}
    username: ${MPLADS_DB_USERNAME:mpladsentinel}
    password: ${MPLADS_DB_PASSWORD:change-me-locally}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    # Flyway is the single source of truth for the schema. Hibernate never
    # creates or alters tables.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  # Local dev default is 8081 (8080 is commonly taken by other local apps).
  port: ${MPLADS_SERVER_PORT:8081}

mplads:
  security:
    # Comma-separated list of browser origins allowed to call /api/** via CORS.
    cors-allowed-origins: ${MPLADS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.mpladsentinel: DEBUG
