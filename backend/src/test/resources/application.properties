# Test configuration.
#
# The Project Foundation test suite verifies that the application context wires
# up and that the HTTP + security layer works. It does not require a database,
# so datasource and Flyway auto-configuration are excluded here. Tests that need
# a real PostgreSQL instance are added alongside the data-layer phase.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

mplads.security.cors-allowed-origins=http://localhost:5173
