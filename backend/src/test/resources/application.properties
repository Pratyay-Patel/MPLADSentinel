# Test configuration.
#
# From the PostgreSQL Data Layer phase on, the test suite runs against a real
# PostgreSQL instance provided by Testcontainers (see
# com.mpladsentinel.support.AbstractPostgresIntegrationTest, which supplies the
# spring.datasource.* properties via @DynamicPropertySource).
#
# Flyway owns the schema in tests exactly as in production; Hibernate only maps
# to it.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

mplads.security.cors-allowed-origins=http://localhost:5173
